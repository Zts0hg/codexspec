<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CodexSpec Distill Review</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header><h1 id="page-title">Distill review</h1><p id="status" role="status" aria-live="polite" aria-atomic="true" tabindex="-1">Loading…</p></header>
  <main>
    <nav id="records" aria-label="Candidate records"></nav>
    <section id="editor" aria-live="polite"></section>
    <aside><h2 id="summary-title">Staged changes</h2><pre id="summary"></pre></aside>
  </main>
  <footer>
    <button id="refresh" type="button" hidden>Refresh conflicted records</button>
    <button id="apply" type="button">Apply all</button>
    <button id="cancel" type="button">Cancel</button>
    <button id="discard" type="button">Discard draft</button>
  </footer>
  <script src="/app.js"></script>
</body>
</html>
